<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Mission Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="title-container">
        <h1>Space Mission Game</h1>
    </div>
    <div id="game-container">
        <div id="options">
            <button id="Commander">Commander</button>
            <button id="Engineer">Engineer</button>
        </div>
        <div id="button-container">
            <button id ="start-btn">Start</button>
        </div>
    </div>

    <div id="game-over-container" class = "hidden">
        <h2>Game Over</h2>
        <button id="restart-btn">Restart</button>
    </div>

<!-- Engineer page2 -->
    <div id="engineer-page2" class="hidden">
        <h1> Choose a Mission!</h1>
        <div id = "mission1-container">
            <p>Details about Mission 1</p>
            <button id="mission1">Mission 1</button>
        </div>
      
        <div id = "mission2-container">
            <p>Details about Mission 2</p>
            <button id="mission2">Mission 2</button>
        </div>
        <div id = "mission3-container">
            <p>Details about Mission 3</p>
            <button id="mission3">Mission 3</button>
        </div>
    </div>
<!-- Engineer page3 if Mission1 -->
    <div id="engineer-miss1" class="hidden">
        <h1>Mission 1</h1>
        <div id = "mission1-container">
            <p>Move the Sliders to see their tradeoff!</p>
            <input type="range" id="slider1" min="0" max="100" value="50">
            <label for="slider1">Electrical Power</label>

            <input type="range" id="slider2" min="0" max="100" value="50">
            <label for="slider2">Mass</label>

            <input type="range" id="slider3" min="0" max="100" value="50">
            <label for="slider3">Flight</label>

            <input type="range" id="slider4" min="0" max="100" value="50">
            <label for="slider4">Fuel</label>

            <input type="range" id="slider5" min="0" max="100" value="50">
            <label for="slider5">Cost</label>
            
            <input type="range" id="slider6" min="0" max="100" value="50">
            <label for="slider6">Propulsion</label>

            <button id="submit-sliders">Submit</button>

        </div>


    </div>

</body>
</html>
